<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>모바일신분증 · 내 일정 관리 시연</title><link rel="stylesheet" href="style.css"><script defer src="core.js"></script><script defer src="app.js"></script></head>
<body>
<main class="stage">
<div class="phone" id="phone" aria-label="휴대전화 화면 시연">
  <div class="statusbar" id="statusbar"><span class="status-time">11:30</span><span class="status-symbols"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 11h3v7H2zm5-4h3v11H7zm5-4h3v15h-3zm5-3h3v18h-3z" fill="currentColor"/></svg><span>LTE</span><span>79%</span><span class="battery"></span></span></div>
  <section id="homeScreen" class="screen current" aria-label="목록 조회">
    <div class="original-toolbar" role="heading" aria-level="1" aria-label="목록 조회"></div>
    <div class="screen-scroll original-scroll" id="homeScroll">
      <div class="original-cards" role="img" aria-label="기존 화면: 모바일 주민등록증, 모바일 운전면허증, 모바일 국가보훈등록증 목록"></div>
      <article class="schedule-entry">
        <h2>내 일정 관리</h2><div class="entry-rule"></div>
        <dl><div><dt>신청목록</dt><dd id="entryCount">3건</dd></div><div><dt>최근일정</dt><dd id="entryNext"></dd></div></dl>
        <button id="entryOpen" class="lookup" type="button">조회하기</button>
      </article>
    </div>
  </section>
  <section id="scheduleScreen" class="screen" aria-label="내 일정 관리" hidden>
    <header class="native-header"><button class="icon-button" data-go="home" aria-label="뒤로" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button><h1>내 일정 관리</h1><button class="icon-button" id="inboxOpen" aria-label="메시지 보기" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v14H8l-5 4zM7 9h10M7 13h7"/></svg><span id="unreadDot" class="unread-dot" hidden></span></button></header>
    <div class="screen-scroll schedule-scroll"><h2 class="section-title">신청목록 <span id="listCount">3</span></h2><div id="scheduleList"></div></div>
  </section>
  <section id="detailScreen" class="screen" aria-label="일정 안내" hidden>
    <header class="native-header"><button class="icon-button" data-go="schedule" aria-label="뒤로" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button><h1>일정 안내</h1><span></span></header>
    <div class="screen-scroll detail-scroll" id="detailContent"></div>
  </section>
  <section id="lockScreen" class="screen lock-screen" aria-label="잠금화면" hidden>
    <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10" width="12" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <div class="lock-clock">11:30</div><div id="lockDate" class="lock-date"></div>
    <div class="lock-notifications" id="lockNotifications" aria-live="polite"></div>
    <button id="unlock" class="unlock" type="button">화면을 밀어 잠금해제</button>
  </section>
  <section id="messagesScreen" class="screen messages-screen" aria-label="메시지" hidden>
    <header class="native-header"><button class="icon-button" data-go="schedule" aria-label="뒤로" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button><h1 id="messageSender">메시지</h1><span class="sender-icon" aria-hidden="true">⋮</span></header>
    <div id="messagesContent" class="screen-scroll messages-scroll"></div>
    <div class="message-compose" aria-hidden="true"><span>＋</span><div>메시지 입력</div><span>☺</span></div>
  </section>
  <nav class="android-nav" id="androidNav" aria-label="휴대전화 탐색"><button id="recentButton" aria-label="최근 화면" type="button"><span class="recent-icon"></span></button><button id="homeButton" aria-label="홈" type="button"><span class="home-icon"></span></button><button id="backButton" aria-label="뒤로" type="button"><span class="back-icon"></span></button></nav>
</div>
<div class="demo-bar"><span>시연</span><button id="demoHome" type="button">기존 화면</button><button id="demoSchedule" type="button">내 일정 관리</button><button id="demoReceive" type="button">문자 수신</button></div>
</main>
</body></html>
